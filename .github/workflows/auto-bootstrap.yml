name: Propose standards adoption
on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: 'Exact owned repository (ShadowWalkerNC/name); explicit adoption only'
        type: string
        required: true
      scope:
        description: 'Named adoption scope, such as documentation or checkout UI'
        type: string
        required: true
      source_ref:
        description: 'Reviewed immutable library commit or release tag'
        type: string
        required: true
      version:
        description: 'Library version matching that source'
        type: string
        required: true
      standards:
        description: 'Comma-separated standard IDs; blank preserves installed selection'
        type: string
        default: ''
      playbooks:
        description: 'Comma-separated playbook IDs; blank preserves installed selection'
        type: string
        default: ''
      preset:
        description: 'Optional: operational, reading, hospitality, creative; blank preserves installed selection'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: standards-proposal-${{ inputs.target_repository }}
  cancel-in-progress: false
jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - name: Validate selected target
        env:
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          PROPOSAL_TOKEN: ${{ secrets.ORG_BOOTSTRAP_TOKEN }}
        run: |
          [[ "$TARGET_REPOSITORY" =~ ^ShadowWalkerNC/[A-Za-z0-9_.-]+$ ]] || exit 1
          [[ "$TARGET_REPOSITORY" != 'ShadowWalkerNC/.github' ]] || exit 1
          [[ -n "$PROPOSAL_TOKEN" ]] || { echo 'Missing proposal credentials'; exit 1; }
      - uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: library-source
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repository }}
          token: ${{ secrets.ORG_BOOTSTRAP_TOKEN }}
          path: target
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tooling/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: tooling
      - name: Configure GitHub Git authentication
        env:
          GH_TOKEN: ${{ secrets.ORG_BOOTSTRAP_TOKEN }}
        run: gh auth setup-git
      - name: Propose selected bundle
        env:
          ORG_BOOTSTRAP_TOKEN: ${{ secrets.ORG_BOOTSTRAP_TOKEN }}
          GH_TOKEN: ${{ secrets.ORG_BOOTSTRAP_TOKEN }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          ADOPTION_SCOPE: ${{ inputs.scope }}
          LIBRARY_VERSION: ${{ inputs.version }}
          LIBRARY_REF: ${{ inputs.source_ref }}
          SELECTED_STANDARDS: ${{ inputs.standards }}
          SELECTED_PLAYBOOKS: ${{ inputs.playbooks }}
          SELECTED_PRESET: ${{ inputs.preset }}
        run: node tooling/scripts/propose-inputs.mjs
